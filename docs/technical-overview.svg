<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1000" viewBox="0 0 1480 1000" font-family="'Chalkboard SE','Comic Sans MS','Hanzipen SC','Segoe Print',cursive">

<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="41" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="29" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>

  <marker id="aInk" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
    <path d="M1,1 L8,5 L1,9" fill="none" stroke="#33302B" stroke-width="1.7" stroke-linecap="round"/>
  </marker>
  <marker id="aRed" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
    <path d="M1,1 L8,5 L1,9" fill="none" stroke="#C2453C" stroke-width="1.7" stroke-linecap="round"/>
  </marker>
  <marker id="aBlu" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
    <path d="M1,1 L8,5 L1,9" fill="none" stroke="#3C6E9E" stroke-width="1.7" stroke-linecap="round"/>
  </marker>
  <marker id="aGry" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto-start-reverse">
    <path d="M1,1 L8,5 L1,9" fill="none" stroke="#8C867D" stroke-width="1.7" stroke-linecap="round"/>
  </marker>
</defs>

<style>
  text { fill:#33302B; }
  .ink { fill:#33302B; }
  .red { fill:#C2453C; }
  .grn { fill:#4E7C5B; }
  .blu { fill:#3C6E9E; }
  .amb { fill:#A8730F; }
  .gry { fill:#8C867D; }

  .sRed { stroke:#C2453C; fill:none; }
  .sGrn { stroke:#4E7C5B; fill:none; }
  .sBlu { stroke:#3C6E9E; fill:none; }
  .sGry { stroke:#B5AEA3; fill:none; }
  .sAmb { stroke:#D9A441; fill:none; }
  .sInk { stroke:#33302B; fill:none; }
  .sDim { stroke:#8C867D; fill:none; }

  .code  { font-family:Menlo,Monaco,monospace; font-size:12px; }
  .codeb { font-family:Menlo,Monaco,monospace; font-size:12px; font-weight:700; }
  .xs  { font-size:11.5px; }
  .sm  { font-size:13px; }
  .t   { font-size:14.5px; }
  .tb  { font-size:14.5px; font-weight:700; }
  .big { font-size:17px; font-weight:700; }
  .h   { font-size:20px; font-weight:700; }
  .mid { text-anchor:middle; }
  .end { text-anchor:end; }
</style>

<rect width="1480" height="1000" fill="#FDFAF4"/>

<!-- 标题 -->
<text class="mid" x="740" y="54" font-size="26" font-weight="700" fill="#33302B">mcp-guarder 整体架构</text>
<text class="mid gry" x="740" y="82" font-size="13.5">stdio 透明代理：只深加工 tools/list 和 tools/call，其余报文原样转发</text>
<path d="M500,102 Q740,96 980,102" class="sGry" stroke-width="2" filter="url(#rough)"/>

<!-- ══ 三大块：客户端 │ 网关 │ 上游 Server ══════════════════════════ -->
<g filter="url(#rough)">
  <rect x="40" y="120" width="200" height="620" rx="12" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="2"/>
  <rect x="280" y="120" width="920" height="620" rx="12" fill="#F1F6FB" stroke="#3C6E9E" stroke-width="2.4"/>
  <rect x="1240" y="120" width="200" height="620" rx="12" fill="#FCF2F1" stroke="#C2453C" stroke-width="2.4"/>
</g>
<g filter="url(#soft)">
  <rect x="300" y="168" width="880" height="184" rx="10" fill="#FFFFFF" stroke="#B5AEA3" stroke-width="2"/>
  <rect x="300" y="428" width="880" height="300" rx="10" fill="#FFFFFF" stroke="#B5AEA3" stroke-width="2"/>
</g>

<!-- 客户端 -->
<text class="mid tb" x="140" y="150">Claude Code</text>
<text class="mid xs gry" x="140" y="170">MCP client</text>
<text class="end xs" x="228" y="276">发起 tools/call</text>
<text class="end xs" x="228" y="520">拿到过滤后的工具</text>
<text class="end xs" x="228" y="633">拿到脱敏后的结果</text>
<text class="xs gry" x="52" y="690">工具名不变：</text>
<text class="code gry" x="52" y="710">mcp__&lt;server&gt;__&lt;tool&gt;</text>

<!-- 上游 Server -->
<text class="mid tb" x="1340" y="150">上游 MCP Server</text>
<text class="mid xs red" x="1340" y="170">子进程 · 不可信</text>
<text class="xs" x="1252" y="276">执行调用</text>
<text class="xs" x="1252" y="520">返回 tools/list</text>
<text class="xs" x="1252" y="633">返回调用结果</text>
<text class="xs gry" x="1252" y="690">独立进程组</text>
<text class="xs gry" x="1252" y="708">客户端关 stdin 后</text>
<text class="xs gry" x="1252" y="726">SIGTERM → SIGKILL 整组回收</text>

<!-- 网关标题 -->
<text class="h blu" x="300" y="152">mcp-guarder</text>
<text class="xs gry" x="434" y="152">一个进程代理一个 Server</text>
<text class="end xs gry" x="1180" y="152">fail-closed：检测器出错就拒绝 · 审计写不进就停止放行 tools/call</text>

<!-- ══ 请求方向 ══════════════════════════════════════════════════ -->
<text class="tb" x="320" y="192">请求方向 · client → server <tspan class="code">tools/call</tspan></text>
<text class="end big blu" x="1160" y="194">先脱敏再判权限，没规则放行就拒绝</text>

<g filter="url(#soft)">
  <rect x="320" y="236" width="190" height="96" rx="10" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="1.8"/>
  <rect x="540" y="236" width="190" height="96" rx="10" fill="#E3EFF9" stroke="#3C6E9E" stroke-width="1.8"/>
  <rect x="760" y="236" width="190" height="96" rx="10" fill="#E3EFF9" stroke="#3C6E9E" stroke-width="2.2"/>
</g>

<text class="tb" x="334" y="262">① 按行读 JSON-RPC</text>
<text class="xs" x="334" y="284">id → method 记账</text>
<text class="xs gry" x="334" y="304">readline，不设长度上限</text>

<text class="tb" x="554" y="262">② 出站脱敏</text>
<text class="code" x="554" y="284">params.arguments</text>
<text class="xs" x="554" y="304">打码、删字段或整条拒绝</text>

<text class="tb" x="774" y="262">③ 权限门 · 默认拒绝</text>
<text class="xs" x="774" y="284">首条 glob 匹配即定案</text>
<text class="xs" x="774" y="304">when 条件全满足才放行</text>
<text class="xs gry" x="774" y="324">allow: ask 按 deny 处理</text>

<g filter="url(#soft)">
  <path d="M242,284 Q282,281 318,284" class="sInk" stroke-width="2" marker-end="url(#aInk)"/>
  <path d="M510,284 Q525,282 538,284" class="sInk" stroke-width="2" marker-end="url(#aInk)"/>
  <path d="M730,284 Q745,282 758,284" class="sInk" stroke-width="2" marker-end="url(#aInk)"/>
  <path d="M950,284 Q1095,276 1238,284" class="sInk" stroke-width="2" marker-end="url(#aInk)"/>
  <path d="M855,236 Q560,196 244,214" class="sRed" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#aRed)"/>
</g>
<text class="xs red" x="870" y="228">✗ 拒绝 → result.isError: true</text>
<text class="xs" x="962" y="270">放行：参数已脱敏</text>

<!-- ══ 其余方法：原样转发 ════════════════════════════════════════ -->
<text class="mid code gry" x="740" y="380">initialize · notifications/* · resources/* · prompts/* · ping · sampling</text>
<text class="mid xs gry" x="740" y="398">其余方法只做 id 记账，原始字节双向转发，不认识的字段原样保留</text>
<path d="M1238,412 Q740,406 242,412" class="sDim" stroke-width="1.8" stroke-dasharray="5 5" marker-start="url(#aGry)" marker-end="url(#aGry)" filter="url(#soft)"/>

<!-- ══ 响应方向 ══════════════════════════════════════════════════ -->
<text class="tb" x="320" y="452">响应方向 · server → client</text>
<text class="end big blu" x="1160" y="454">tool 描述进模型上下文之前先过三道检测</text>

<g filter="url(#soft)">
  <rect x="980" y="476" width="190" height="104" rx="10" fill="#E3EFF9" stroke="#3C6E9E" stroke-width="1.8"/>
  <rect x="760" y="476" width="190" height="104" rx="10" fill="#E3EFF9" stroke="#3C6E9E" stroke-width="1.8"/>
  <rect x="540" y="476" width="190" height="104" rx="10" fill="#E3EFF9" stroke="#3C6E9E" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="320" y="476" width="190" height="104" rx="10" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="1.8"/>
  <rect x="760" y="606" width="190" height="70" rx="10" fill="#E3EFF9" stroke="#3C6E9E" stroke-width="1.8"/>
</g>

<text class="tb" x="994" y="502">④ TOFU 指纹</text>
<text class="code" x="994" y="524">blake2b → sqlite</text>
<text class="xs" x="994" y="544">首见：记基线、放行</text>
<text class="xs red" x="994" y="564">✗ 定义变了 → 剥离</text>

<text class="tb" x="774" y="502">⑤ 内置规则 31 条</text>
<text class="xs" x="774" y="524">扫描描述与 inputSchema</text>
<text class="xs red" x="774" y="544">11 deny：命中即剥离</text>
<text class="xs amb" x="774" y="564">20 warn：只告警</text>

<text class="tb" x="554" y="502">⑥ LLM 语义检测</text>
<text class="xs gry" x="554" y="524">可选 · 默认关闭</text>
<text class="xs" x="554" y="544">nonce 隔离 · 严格 JSON</text>
<text class="xs red" x="554" y="564">✗ malicious → 剥离</text>

<text class="tb" x="334" y="502">⑧ 写回 stdout</text>
<text class="xs" x="334" y="524">只写合法 JSON-RPC 行</text>
<text class="xs red" x="334" y="544">检测器出错 → 空列表</text>
<text class="xs gry" x="334" y="564">日志只走 stderr</text>

<text class="tb" x="774" y="630">⑦ 回流脱敏</text>
<text class="code" x="774" y="650">content[].text</text>
<text class="code" x="774" y="668">structuredContent</text>

<g filter="url(#soft)">
  <path d="M1238,528 Q1205,525 1172,528" class="sInk" stroke-width="2" marker-end="url(#aInk)"/>
  <path d="M980,528 Q965,526 952,528" class="sInk" stroke-width="2" marker-end="url(#aInk)"/>
  <path d="M760,528 Q745,526 732,528" class="sInk" stroke-width="2" marker-end="url(#aInk)"/>
  <path d="M540,528 Q525,526 512,528" class="sInk" stroke-width="2" marker-end="url(#aInk)"/>
  <path d="M320,528 Q282,525 244,528" class="sInk" stroke-width="2" marker-end="url(#aInk)"/>
  <path d="M1238,641 Q1095,636 952,641" class="sInk" stroke-width="2" marker-end="url(#aInk)"/>
  <path d="M760,641 Q500,648 244,641" class="sInk" stroke-width="2" marker-end="url(#aInk)"/>
</g>
<text class="xs" x="1000" y="630">tools/call 结果</text>
<text class="xs gry" x="320" y="666">secret 换成 [REDACTED:rule_id]</text>

<!-- ══ 外部端点与持久化 ══════════════════════════════════════════ -->
<g filter="url(#soft)">
  <rect x="40" y="780" width="230" height="104" rx="10" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="1.8"/>
  <rect x="300" y="780" width="240" height="104" rx="10" fill="#FFFFFF" stroke="#B5AEA3" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="560" y="780" width="200" height="104" rx="10" fill="#FFFFFF" stroke="#B5AEA3" stroke-width="1.8"/>
  <rect x="780" y="780" width="220" height="104" rx="10" fill="#FFFFFF" stroke="#B5AEA3" stroke-width="1.8"/>
  <rect x="1020" y="780" width="220" height="104" rx="10" fill="#FFFFFF" stroke="#B5AEA3" stroke-width="1.8"/>
  <rect x="1260" y="780" width="180" height="104" rx="10" fill="#FBF6EC" stroke="#D9C7A4" stroke-width="1.8"/>
</g>

<text class="codeb" x="54" y="806">config.yaml</text>
<text class="xs" x="54" y="828">一份配置对应一个 Server</text>
<text class="xs" x="54" y="848">未知字段、坏正则、规则冲突</text>
<text class="xs red" x="54" y="868">→ 拒绝启动</text>

<text class="tb" x="314" y="806">本地 OpenAI 兼容端点</text>
<text class="xs gry" x="314" y="828">Ollama · vLLM · oMLX</text>
<text class="xs amb" x="314" y="848">超时 / 连不上 → 告警放行</text>
<text class="xs red" x="314" y="868">输出不合法 → 剥离</text>

<text class="code" x="574" y="806">semantic_cache.sqlite</text>
<text class="xs" x="574" y="828">按定义摘要 + 模型 +</text>
<text class="xs" x="574" y="848">prompt 版本缓存判定</text>
<text class="xs gry" x="574" y="868">定义不变就不再调模型</text>

<text class="code" x="794" y="806">fingerprints.sqlite</text>
<text class="code" x="794" y="828">snapshots/&lt;digest&gt;.json</text>
<text class="xs" x="794" y="848">TOFU 基线 + 全文快照</text>
<text class="xs gry" x="794" y="868">供 diff / trust 使用</text>

<text class="code" x="1034" y="806">audit/*.jsonl</text>
<text class="code" x="1034" y="828">guard.log</text>
<text class="xs" x="1034" y="848">每条安全决策一行</text>
<text class="xs gry" x="1034" y="868">先脱敏再落盘</text>

<text class="tb" x="1274" y="806">CLI 子命令</text>
<text class="code" x="1274" y="828">diff · trust</text>
<text class="code" x="1274" y="848">audit tail / grep</text>
<text class="xs gry" x="1274" y="868">读指纹库与审计</text>

<g filter="url(#soft)">
  <path d="M255,780 Q285,752 318,742" class="sDim" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#aGry)"/>
  <path d="M600,580 Q560,700 445,778" class="sBlu" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#aBlu)"/>
  <path d="M690,580 Q700,690 662,778" class="sDim" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#aGry)"/>
  <path d="M1075,580 Q1060,720 893,778" class="sDim" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#aGry)"/>
  <path d="M1130,740 Q1134,760 1130,778" class="sDim" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#aGry)"/>
</g>
<text class="xs gry" x="1142" y="765">每条决策</text>

<!-- ══ 结论胶囊 ══════════════════════════════════════════════════ -->
<g filter="url(#soft)">
  <rect x="120" y="916" width="1240" height="52" rx="26" fill="#FDF3E2" stroke="#D9A441" stroke-width="2"/>
</g>
<text class="mid big amb" x="740" y="948">hooks 看不到 tool 描述和返回结果，投毒检测与结果脱敏只能放在传输层 —— 所以 mcp-guarder 是代理，不是 hook</text>

</svg>
